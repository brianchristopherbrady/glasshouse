# Production-style deployment: the app plus PostgreSQL.
#   cp .env.example .env   # then set real secrets
#   docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: glasshouse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: glasshouse
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U glasshouse -d glasshouse']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  app:
    build: .
    image: glasshouse:local
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://glasshouse:${POSTGRES_PASSWORD}@db:5432/glasshouse
      GLASSHOUSE_API_TOKEN: ${GLASSHOUSE_API_TOKEN:?set GLASSHOUSE_API_TOKEN}
      GLASSHOUSE_ALLOWED_ORIGINS: ${GLASSHOUSE_ALLOWED_ORIGINS:-}
      GLASSHOUSE_TRUST_PROXY: ${GLASSHOUSE_TRUST_PROXY:-false}
      GLASSHOUSE_GITHUB_TOKEN: ${GLASSHOUSE_GITHUB_TOKEN:-}
      GLASSHOUSE_GITHUB_APP_ID: ${GLASSHOUSE_GITHUB_APP_ID:-}
      GLASSHOUSE_GITHUB_APP_PRIVATE_KEY: ${GLASSHOUSE_GITHUB_APP_PRIVATE_KEY:-}
      GLASSHOUSE_GITHUB_WEBHOOK_SECRET: ${GLASSHOUSE_GITHUB_WEBHOOK_SECRET:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
    ports:
      - '${PORT:-4000}:4000'
    restart: unless-stopped

volumes:
  pgdata:
