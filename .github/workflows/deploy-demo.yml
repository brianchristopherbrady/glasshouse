name: Deploy GitHub Pages demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up and seed demo database
        run: npm run db:migrate --workspace apps/server -- --name init
        env:
          DATABASE_URL: file:./dev.db

      - name: Start API server
        run: nohup npm run dev --workspace apps/server > server.log 2>&1 &
        env:
          DATABASE_URL: file:./dev.db

      - name: Wait for API server
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:4000/api/health > /dev/null; then
              echo "server is up"
              exit 0
            fi
            sleep 1
          done
          echo "server did not become ready in time" >&2
          exit 1

      - name: Dump server log on failure
        if: failure()
        run: cat server.log || true

      - name: Export static demo data
        run: node scripts/export-static-demo.mjs

      - name: Build web app for GitHub Pages
        run: npm run build:github-pages --workspace apps/web

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
