name: Release

# Publishes @brianbrady/glasshouse{-domain,-telemetry-client,} when a
# vX.Y.Z tag is pushed. Requires an NPM_TOKEN repository secret with publish
# rights to the @brianbrady npm scope.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Tag matches package versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for pkg in packages/domain packages/telemetry-client apps/server; do
            version=$(node -p "require('./$pkg/package.json').version")
            if [ "$version" != "$tag" ]; then echo "$pkg is $version, tag is $tag" >&2; exit 1; fi
          done
      - run: npx prisma generate --schema apps/server/prisma/schema.prisma
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          REQUIRE_WEB_DIST: 'true'
      - name: Publish
        # Skips versions already on npm, so a partially failed release can be re-run.
        run: |
          for pkg in packages/domain packages/telemetry-client apps/server; do
            name=$(node -p "require('./$pkg/package.json').name")
            version=$(node -p "require('./$pkg/package.json').version")
            if npm view "$name@$version" version > /dev/null 2>&1; then
              echo "$name@$version is already published; skipping"
            else
              npm publish -w "$pkg" --provenance --access public
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
